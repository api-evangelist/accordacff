apis:
  - name: Accord Developer API (GraphQL)
    description: >-
      A single GraphQL endpoint exposing the Accord data model — accords, stages, steps, stakeholders, playbooks,
      resources, summaries, engagement and CRM sync objects. The public reference documents 461 queries, 579 mutations
      and 3 subscriptions over 692 object types. Relay-style cursor connections with condition/filter/orderBy arguments;
      authentication is a workspace-scoped bearer API key created by a workspace admin. Listed by Accord as in beta and
      requiring an Accord license that includes API access (Enterprise tier).
    humanURL: https://developers.inaccord.com/
    image: https://cdn.prod.website-files.com/68d3df3714cf3a122c1640dd/6916517cbf54f093700a336d_Home%20Page_OG-min.png
    baseURL: https://api2.inaccord.com/graphql
    tags:
