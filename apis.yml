  - name: Accord MCP Server
    description: >-
      Hosted, remote Model Context Protocol server that wraps the Accord Developer API and exposes its read surface to
      any MCP client (Claude, Claude Code, Cursor, Gemini CLI, ChatGPT). Streamable HTTP transport at
      https://api.inaccord.com/1/mcp/mcp, authenticated with OAuth 2.1 + PKCE and dynamic client registration; scopes
      mcp:read and mcp:write are advertised in the protected-resource metadata. Currently read-only and in beta,
      available to workspaces with API access.
    humanURL: https://collaboration.inaccord.com/knowledge/accord-mcp-server-setup-and-usage
    image: https://cdn.prod.website-files.com/68d3df3714cf3a122c1640dd/6916517cbf54f093700a336d_Home%20Page_OG-min.png
    baseURL: https://api.inaccord.com/1/mcp/mcp
