aid: accordacff
name: Accord
description: >-
  Accord is a San Francisco-based revenue excellence platform for B2B sales, onboarding and customer success teams,
  founded in 2020 by Ross Rich and Ryan Rich. It turns a company's winning sales process into enforceable playbooks,
  mutual action plans and shared buyer workspaces, with stakeholder mapping, deal reviews, execution scoring and
  bi-directional CRM sync. Its developer surface is a single GraphQL endpoint at api2.inaccord.com/graphql covering
  20+ objects (Accords, Stages, Steps, Contacts, Members, Resources, Summaries, Engagements) behind a workspace-scoped
  bearer API key, plus a hosted, OAuth 2.1 + PKCE Model Context Protocol server at api.inaccord.com that exposes the
  same read surface to MCP clients such as Claude, Cursor and ChatGPT.
